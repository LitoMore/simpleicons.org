name: Update Simple Icons and deploy
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Update simple-icons to the latest npm release
        id: update
        run: |
          npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund simple-icons@latest
          if ! git diff --quiet -- package.json package-lock.json; then
            version=$(node -p "require('./package-lock.json').packages['node_modules/simple-icons'].version")
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Test the updated catalog
        if: steps.update.outputs.version != ''
        run: |
          npm ci
          npm test
      - uses: actions/create-github-app-token@v3
        if: steps.update.outputs.version != ''
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the update for Cloudflare Pages
        if: steps.update.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          gh auth setup-git
          git config user.name 'simple-icons[bot]'
          git config user.email 'simple-icons[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "Bump simple-icons@$VERSION"
          git push origin HEAD:main
